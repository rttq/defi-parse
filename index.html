<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stablecoin Rates</title>
<meta name="description" content="USDC/USDT supply and borrow rates on Kamino, Euler and Aave, with trends.">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --fg: #111317; --soft: #41454d;
    --muted: #7a7f89; --line: #e3e5e9; --accent: #0f766e;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f12; --surface: #17191d; --fg: #eceef2; --soft: #b9bdc6;
      --muted: #7d828c; --line: #262930; --accent: #2dd4bf;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 0.875rem/1.5 Inter, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-text-size-adjust: 100%;
  }
  .app { max-width: 420px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  .meta { color: var(--muted); font-size: 0.75rem; }
  button { font: inherit; color: inherit; }
  .btn {
    background: var(--surface); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { color: var(--muted); cursor: default; }
  .btn.icon { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; }
  .btn[aria-busy="true"] svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .btn[aria-busy="true"] svg { animation: none; } }
  /* Installed desktop app: the header becomes the title bar, next to the system window buttons. */
  @media (display-mode: window-controls-overlay) {
    header {
      position: fixed; z-index: 1; margin: 0; padding: 0 8px 0 16px; background: var(--bg);
      left: env(titlebar-area-x, 0); top: env(titlebar-area-y, 0);
      width: env(titlebar-area-width, 100%); height: env(titlebar-area-height, 40px);
      app-region: drag; -webkit-app-region: drag;
    }
    header > div { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; }
    h1 { font-size: 0.875rem; }
    header .btn { app-region: no-drag; -webkit-app-region: no-drag; width: 28px; height: 28px; }
    .app { padding-top: calc(env(titlebar-area-height, 40px) + 12px); }
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  section {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 12px; overflow: hidden;
  }
  h2 {
    font-size: 0.75rem; font-weight: 500; color: var(--muted); margin: 0;
    padding: 10px 16px 6px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .row {
    display: grid; grid-template-columns: minmax(0, 1fr) 56px 88px; align-items: center; gap: 12px;
    width: 100%; padding: 10px 16px; background: none; border: 0; border-top: 1px solid var(--line);
    text-align: left; cursor: pointer;
  }
  .row:hover { background: color-mix(in srgb, var(--line) 35%, transparent); }
  .row[aria-disabled="true"] { cursor: default; background: none; }
  .row span { display: block; }
  .asset { font-weight: 600; }
  .where { color: var(--soft); font-size: 0.75rem; }
  .spark { width: 56px; height: 24px; color: var(--accent); }
  .rates { text-align: right; white-space: nowrap; }
  .supply { font-weight: 600; }
  .borrow, .na { color: var(--muted); font-size: 0.75rem; }
  .detail { padding: 0 16px 16px; }
  .chart { display: block; width: 100%; height: 120px; margin: 8px 0; }
  .chart .s { stroke: var(--accent); }
  .chart .b { stroke: var(--muted); stroke-dasharray: 4 3; }
  .legend, .axis { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 0.75rem; }
  .legend i { display: inline-block; width: 14px; margin-right: 6px; vertical-align: middle; border-top: 2px solid var(--accent); }
  .legend i.dash { border-top: 2px dashed var(--muted); }
  .open { display: block; margin-top: 12px; text-align: center; text-decoration: none; }
  .status { text-align: center; padding: 32px 16px; color: var(--soft); }
  .status .btn { margin-top: 12px; }
  footer { display: flex; justify-content: flex-end; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Stablecoin rates</h1>
      <div class="meta" id="updated">&nbsp;</div>
    </div>
    <button class="btn icon" id="refresh" aria-label="Refresh" title="Refresh">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>
  <main id="list"><p class="status">Loading…</p></main>
  <footer><button class="btn" id="export" disabled>Export CSV</button></footer>
</div>
<script>
const API = 'https://yields.llama.fi';
const $ = (s) => document.querySelector(s);
const pct = (v) => v.toFixed(2) + '%';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmtDate = (d) => new Date(d + 'T00:00:00Z').toLocaleDateString([], { month: 'short', day: 'numeric', timeZone: 'UTC' });

let state = null;  // { watchlist, charts: id -> [{date, apy}] | null, borrowNow: id -> apy, borrowHist: id -> [{date, apy}] }
let openId = null;

async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}

// DefiLlama /chart points -> one {date, apy} per UTC day, last point of the day wins.
function daily(points) {
  const byDate = new Map();
  for (const p of points) if (p.apy != null) byDate.set(p.timestamp.slice(0, 10), p.apy);
  return [...byDate].map(([date, apy]) => ({ date, apy }));
}

// history.csv (written by defi_parser.py) -> borrow APY series per pool.
function parseHistory(text) {
  const [head, ...lines] = text.trim().split(/\r?\n/);
  const cols = head.split(',');
  const [iDate, iId, iBorrow] = ['date', 'pool_id', 'borrow_apy'].map((c) => cols.indexOf(c));
  const byId = new Map();
  for (const line of lines) {
    const c = line.split(',');
    if (!c[iBorrow]) continue;
    if (!byId.has(c[iId])) byId.set(c[iId], []);
    byId.get(c[iId]).push({ date: c[iDate], apy: +c[iBorrow] });
  }
  for (const pts of byId.values()) pts.sort((a, b) => a.date.localeCompare(b.date));
  return byId;
}

async function load() {
  const btn = $('#refresh');
  btn.disabled = true;
  btn.setAttribute('aria-busy', 'true');
  try {
    const watchlist = await getJSON('watchlist.json');
    const [charts, lendBorrow, history] = await Promise.all([
      Promise.allSettled(watchlist.map((w) => getJSON(`${API}/chart/${w.id}`).then((d) => daily(d.data)))),
      getJSON(`${API}/lendBorrow`).catch(() => []),
      fetch('history.csv', { cache: 'no-store' })
        .then((r) => (r.ok ? r.text() : ''))
        .then((t) => (t ? parseHistory(t) : new Map()))
        .catch(() => new Map()),
    ]);
    const chartById = new Map(watchlist.map((w, i) => [w.id, charts[i].status === 'fulfilled' && charts[i].value.length ? charts[i].value : null]));
    if (![...chartById.values()].some(Boolean)) throw new Error('No pool data could be loaded.');
    state = {
      watchlist,
      charts: chartById,
      borrowNow: new Map(lendBorrow.map((b) => [b.pool, b.apyBaseBorrow])),
      borrowHist: history,
    };
    $('#updated').textContent = 'updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    $('#export').disabled = false;
    render();
  } catch (e) {
    $('#list').innerHTML = `<div class="status"><p>Couldn't load rates.<br><span class="meta">${esc(e.message)}</span></p><button class="btn" id="retry">Retry</button></div>`;
    $('#retry').onclick = load;
  } finally {
    btn.disabled = false;
    btn.removeAttribute('aria-busy');
  }
}

function polyline(points, cls = '') {
  return `<polyline class="${cls}" points="${points}" fill="none" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
}

function spark(pts) {
  if (pts.length < 2) return '<span class="spark"></span>';
  const vals = pts.map((p) => p.apy);
  const min = Math.min(...vals), span = Math.max(...vals) - min || 1;
  const xy = vals.map((v, i) => `${(i / (vals.length - 1) * 56).toFixed(1)},${(22 - (v - min) / span * 20).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 56 24" preserveAspectRatio="none" aria-hidden="true" stroke="currentColor">${polyline(xy)}</svg>`;
}

const link = (w) => (w.url ? `<a class="btn open" href="${esc(w.url)}" target="_blank" rel="noopener">Open in ${esc(w.platform)} ↗</a>` : '');

function detail(w, pts) {
  const supply = pts.slice(-90);
  if (supply.length < 2) return `<div class="detail"><p class="meta">Not enough history yet.</p>${link(w)}</div>`;
  const start = supply[0].date;
  const borrowPts = (state.borrowHist.get(w.id) || []).filter((p) => p.date >= start);
  const borrow = borrowPts.length >= 2 ? borrowPts : null;
  const all = borrow ? supply.concat(borrow) : supply;
  const vals = all.map((p) => p.apy);
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const end = all.reduce((d, p) => (p.date > d ? p.date : d), start);
  const t0 = Date.parse(start), tSpan = Date.parse(end) - t0 || 1;
  const xy = (series) => series.map((p) => `${((Date.parse(p.date) - t0) / tSpan * 300).toFixed(1)},${(112 - (p.apy - min) / span * 104).toFixed(1)}`).join(' ');
  return `<div class="detail">
    <div class="legend"><span><i></i>Supply</span>${borrow ? '<span><i class="dash"></i>Borrow</span>' : ''}<span>min ${pct(min)} · max ${pct(max)}</span></div>
    <svg class="chart" viewBox="0 0 300 120" preserveAspectRatio="none" aria-hidden="true">
      ${borrow ? polyline(xy(borrow), 'b') : ''}${polyline(xy(supply), 's')}
    </svg>
    <div class="axis"><span>${fmtDate(start)}</span><span>${fmtDate(end)}</span></div>
    ${link(w)}
  </div>`;
}

function row(w, varying) {
  const pts = state.charts.get(w.id);
  const where = varying.map((k) => w[k]).join(' · ');
  const name = `<span class="name"><span class="asset">${esc(w.asset)}</span><span class="where">${esc(where)}</span></span>`;
  if (!pts) return `<div class="row" aria-disabled="true">${name}<span></span><span class="rates na">unavailable</span></div>`;
  const borrow = state.borrowNow.get(w.id);
  const open = openId === w.id;
  return `<button class="row" data-id="${esc(w.id)}" aria-expanded="${open}">${name}${spark(pts.slice(-30))}
    <span class="rates"><span class="supply">${pct(pts.at(-1).apy)}</span>${borrow != null ? `<span class="borrow">borrow ${pct(borrow)}</span>` : ''}</span>
  </button>${open ? detail(w, pts) : ''}`;
}

function render() {
  const groups = new Map();
  for (const w of state.watchlist) {
    if (!groups.has(w.platform)) groups.set(w.platform, []);
    groups.get(w.platform).push(w);
  }
  // Market/chain shared by the whole group go in the heading; only what differs stays on the rows.
  $('#list').innerHTML = [...groups].map(([platform, items]) => {
    const shared = ['market', 'chain'].filter((k) => new Set(items.map((w) => w[k])).size === 1);
    const varying = ['market', 'chain'].filter((k) => !shared.includes(k));
    const heading = [platform, ...shared.map((k) => items[0][k])].join(' · ');
    return `<section><h2>${esc(heading)}</h2>${items.map((w) => row(w, varying)).join('')}</section>`;
  }).join('');
}

function exportCSV() {
  const lines = ['date,platform,market,chain,asset,supply_apy,borrow_apy'];
  for (const w of state.watchlist) {
    const pts = state.charts.get(w.id);
    if (!pts) continue;
    const borrowByDate = new Map((state.borrowHist.get(w.id) || []).map((p) => [p.date, p.apy]));
    for (const p of pts) lines.push([p.date, w.platform, w.market, w.chain, w.asset, p.apy, borrowByDate.get(p.date) ?? ''].join(','));
  }
  const url = URL.createObjectURL(new Blob([lines.join('\n') + '\n'], { type: 'text/csv' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: `stablecoin-rates-${new Date().toISOString().slice(0, 10)}.csv` });
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$('#list').addEventListener('click', (e) => {
  const btn = e.target.closest('button.row');
  if (!btn) return;
  openId = openId === btn.dataset.id ? null : btn.dataset.id;
  render();
  $(`.row[data-id="${btn.dataset.id}"]`).focus();
});
// First launch as an installed app: open at phone proportions once, then respect the user's size.
if (matchMedia('(display-mode: standalone), (display-mode: window-controls-overlay)').matches) {
  let sized = false;
  try { sized = !!localStorage.getItem('sized'); localStorage.setItem('sized', '1'); } catch {}
  if (!sized) window.resizeTo(400, 760);
}
$('#refresh').onclick = load;
$('#export').onclick = exportCSV;
load();
</script>
</body>
</html>
